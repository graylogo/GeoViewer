name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 必须用 macOS 26（Tahoe）runner：
    # Views/MapPane.swift 的 MapControlButton 用到了 macOS 26 才有的
    # Liquid Glass（buttonStyle(.glass)）。虽然代码里有 #available(macOS 26.0, *)
    # 做运行时回退，但 .glass 这个符号只在 macOS 26+ SDK 里存在，
    # 拿老 SDK（如 macos-15 image）编译会直接报
    # 「reference to member 'glass' cannot be resolved」。
    # 注意：这是构建环境要求，不影响运行时——app 仍可在 macOS 14 上运行，
    # 老系统走 #available 的 else 分支回退到毛玻璃样式。
    name: Build & CLI smoke (macOS 26)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: CLI smoke test
        run: bash scripts/cli_smoke.sh
